<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>E-SKRIPSI · Teknik Elektro Universitas Teknologi Sumbawa</title>
<style>
/* Layout: sidebar peran + area kerja; tabel dan kartu status berbasis token */
:root{
  --bg:#ffffff; --surface:#ffffff; --fg:#111111; --muted:#555555; --line:#d9d9d9;
  --accent:#c8102e; --accent-soft:#f5f5f5; --accent-fg:#ffffff; --brand2:#c8102e; --brand2-soft:#f5f5f5;
  --ok:#111111; --ok-soft:#f5f5f5; --warn:#111111; --warn-soft:#f5f5f5; --bad:#c8102e; --bad-soft:#fdeef0;
  color-scheme:light; --display:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding-inline:16px;padding-block:20px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.02rem;font-family:var(--body);font-weight:700}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand small{display:block;color:var(--muted);font-size:.82rem}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
nav{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px}
@media (max-width:760px){nav{flex-direction:row;flex-wrap:wrap}}
nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:4px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
nav button.on{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;gap:14px;min-width:0}
.panel p{margin:0;color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:4px;font:600 .88rem var(--body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-n{background:var(--accent-soft);color:var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 7px;line-height:1.6}
form{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:.85rem;font-weight:600}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%}
.empty{padding:18px;border:1px dashed var(--line);border-radius:4px;color:var(--muted);text-align:center}
.steps{display:grid;gap:0;list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 .7rem var(--mono);color:var(--muted)}
.dot.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dot.cur{border-color:var(--warn);color:var(--warn)}
.notif{display:grid;gap:8px}
.notif div{padding:10px 12px;border-radius:4px;background:var(--bg);border:1px solid var(--line);font-size:.88rem}
.notif div.new{border-color:var(--accent)}
.notif time{display:block;color:var(--muted);font-size:.75rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.login{width:100%;max-width:440px;margin:0 auto;display:grid}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:700;text-decoration:underline}
summary{cursor:pointer}
input[type="time"]{color-scheme:light}
input[type="time"]::-webkit-calendar-picker-indicator{filter:brightness(0);opacity:1;cursor:pointer}
.surat{border:1px solid var(--fg);padding:20px;display:grid;gap:10px;max-width:640px;font-size:.9rem;background:var(--surface)}
.surat p,.surat ol{margin:0;color:var(--fg)}.surat ol{padding-left:20px}
.kop{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--fg);padding-bottom:10px}
.surat .meta{width:auto}.surat .meta td{border:0;padding:2px 8px 2px 0;vertical-align:top}
tr.atur td{background:#f5f5f5;border-left:3px solid var(--accent)}
tr.atur form{max-width:720px}
.qr{width:96px;height:96px;image-rendering:pixelated;margin:6px 0;display:block}
.ttd{justify-self:end;text-align:left;min-width:220px}
a.btn{text-decoration:none;display:inline-block;white-space:nowrap}
.brand{display:flex;align-items:center;gap:12px;text-align:left}
.logo{height:46px;width:auto;mix-blend-mode:multiply;flex:none}
.logo.big{height:150px;margin:0 auto;display:block}
.top{border-bottom:3px solid var(--brand2);padding-bottom:14px}
nav button.on{box-shadow:inset 3px 0 0 var(--brand2)}
.badge{background:var(--brand2)}
input[type="date"]{color-scheme:light}
input[type="date"]::-webkit-calendar-picker-indicator{filter:brightness(0);opacity:1;cursor:pointer}
.confirm{margin-top:8px;padding:10px;border:1px solid var(--bad);background:var(--bad-soft);border-radius:4px;font-size:.85rem;display:grid;gap:8px}
tr.off td{opacity:.6}
.pwd{background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:4px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tile{all:unset;cursor:pointer;display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:.8rem;font-weight:600;color:var(--muted)}
.tile .tn{font-size:1.3rem;color:var(--fg)}
.tile.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent)}
.prog{display:flex;gap:3px}.prog i{width:16px;height:7px;border-radius:2px;background:var(--line)}
.prog i.done{background:var(--ok)}.prog i.cur{background:var(--warn)}
.tsel{min-width:170px;padding:5px 8px;font-size:.85rem}
.dt{width:auto;min-width:140px;padding:5px 8px;font-size:.85rem}
.chart{display:grid;gap:14px}
.crow{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:14px;align-items:center}
@media (max-width:600px){.crow{grid-template-columns:1fr;gap:6px}.axis>div:first-child{display:none}}
.cname{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.88rem;min-width:0}
.cbars{display:grid;gap:4px;padding-right:28px}
.bar-track{display:flex;align-items:center;height:16px;position:relative}
.bar{height:100%}
.bar.b{background:var(--accent)} .bar.p{background:var(--brand2)}
.bar.wait{opacity:.35}
.bar-track .bar:first-child{border-radius:4px 0 0 3px}
.bar-val{margin-left:6px;font:500 .78rem var(--mono);color:var(--muted)}
.ticks{position:relative;height:16px;margin-right:28px;border-top:1px solid var(--line)}
.ticks span{position:absolute;transform:translateX(-50%);font:500 .72rem var(--mono);color:var(--muted);top:2px}
.lg{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}.sw.b{background:var(--accent)}.sw.p{background:var(--brand2)}.sw.wait{opacity:.35}
.ava{border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-family:var(--display);flex:none;border:1px solid var(--line)}
.prof{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:start}
@media (max-width:600px){.prof{grid-template-columns:1fr}}
.fotobox{display:grid;gap:10px;justify-items:center;text-align:center;padding:16px;border:1px dashed var(--line);border-radius:4px;background:var(--bg)}
input[readonly]{color:var(--muted)}
.bellwrap{position:relative}
.bell{all:unset;cursor:pointer;position:relative;display:grid;padding:7px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.bell:hover,.bell[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
.bell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bell .badge{position:absolute;top:-6px;right:-6px}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;display:grid;gap:10px;z-index:20}
@media (max-width:600px){.pop{position:fixed;left:16px;right:16px;top:70px;width:auto}}
.pw{position:relative;display:block}.pw input{padding-right:42px}
.eye{all:unset;position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--muted);display:grid;padding:4px;border-radius:4px}
.eye:hover{color:var(--accent)}.eye:focus-visible{outline:2px solid var(--accent)}
.eye .slash{display:none}.eye.on .slash{display:inline}
.demo button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
.cred{background:var(--accent-soft);color:var(--accent);padding:10px 12px;border-radius:4px;font-size:.88rem}
.note{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Tampilan sederhana: merah, putih, hitam */
h1,h2{font-weight:700}
.panel{padding:16px}
.btn{border-color:var(--fg)}
.btn.bad{color:var(--fg);border-color:var(--fg)}
.pill{border-radius:4px;border:1px solid var(--fg);background:var(--surface);color:var(--fg)}
.p-ok{background:var(--fg);color:var(--surface)}
.p-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.p-warn,.p-n{background:var(--surface);color:var(--fg)}
.cred{background:var(--surface);border:1px solid var(--fg);color:var(--fg)}
nav button.on{background:var(--surface);color:var(--accent)}
.ava{background:var(--surface);color:var(--fg);border-color:var(--fg)}
.bar.b,.sw.b{background:var(--fg)}
.prog i.cur{background:var(--accent)}
.dot.cur{border-color:var(--accent);color:var(--accent)}
.tile.on{background:var(--surface)}
.pwd{background:var(--surface);border:1px solid var(--accent);color:var(--accent)}
.toast{border-radius:4px}
.bar.g1,.sw.g1{background:#1e8e3e}.bar.g2,.sw.g2{background:#f28c00}.bar.g3,.sw.g3{background:#d32f2f}
.bar-track{height:13px}
.svg td.svc{text-align:center;vertical-align:middle}.svg th{text-align:center}.svg th:nth-child(2){text-align:left}
.svg input[type="radio"]{width:18px;height:18px;accent-color:var(--accent);padding:0}
.svg tbody tr:hover td{background:#f7f7f7}
nav button.lock{opacity:.45;cursor:not-allowed}
body.sibuk,body.sibuk *{cursor:progress!important}
body.sibuk button{pointer-events:none;opacity:.75}
</style>
</head>

};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function unread(){return S.notif.filter(n=>n.to===S.user?.id&&n.baru).length}

// Panel yang sedang terbuka, saringan, dan isian sementara tidak terbawa ke pengguna berikutnya
function resetUI(){S.dokEdit=null;S.dokDel=null;for(const k in KETIK)delete KETIK[k];for(const k of ["tab","aturId","undId","aturTim","sahId","delId","batalSvId","cariArsip","cari","cariId"])S[k]=null;S.bell=false;S.editJudul=false;S.svDraft={};S.pgAkun=1}
function renderKeep(){
  const simpan={};document.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{if(el.type!=="file"&&el.type!=="radio"&&el.type!=="checkbox")simpan[el.id]=el.value});
  render();
  for(const id in simpan){const el=document.getElementById(id);if(el&&el.value!==simpan[id])el.value=simpan[id]}
}
// Dosen dan mahasiswa wajib melengkapi identitas diri sebelum memakai menu lain
const WAJIB=[["jk","jenis kelamin"],["tlahir","tempat lahir"],["tgllahir","tanggal lahir"],["email","email"],["hp","nomor HP"]];
const kurang=u=>u&&(u.role==="dosen"||u.role==="mahasiswa")?WAJIB.filter(([k])=>!u[k]).map(x=>x[1]):[];
const KP=()=>S.pejabat.kp?{nama:S.pejabat.kp,nidn:S.pejabat.kpNidn}:null; // Ketua Program Studi: hanya nama penanda tangan, bukan akun
// Teks yang sedang diketik tetap ada walaupun halaman digambar ulang karena tombol lain diklik.
// Isian dianggap selesai (tidak dipulihkan) saat form-nya dikirim atau kolomnya sudah tidak tampil.
const KETIK={};let idTerkirim=null;
function pulihkanKetikan(){
  if(idTerkirim){idTerkirim.forEach(id=>delete KETIK[id])}
  for(const id in KETIK){const el=document.querySelector?document.querySelector("#"+CSS.escape(id)):null;
    if(!el){delete KETIK[id];continue}
    if(el.value!==KETIK[id])el.value=KETIK[id]}
}
function render(){renderHalaman();if(document.querySelector)pulihkanKetikan()}
function renderHalaman(){
  const app=document.getElementById("app");
  if(!S.user){app.innerHTML=loginView();return}
  const tabs=TABS[S.user.role], kunci=kurang(S.user).length>0; if(!tabs.some(t=>t[0]===S.tab)) S.tab=tabs[0][0]; if(kunci) S.tab="profil";
  app.innerHTML=`
  <header class="top">
    <div class="brand"><img class="logo" src="${LOGO}" alt="Logo Universitas Teknologi Sumbawa"><div><h1>E-SKRIPSI</h1><small>Sistem Pendataan Skripsi · Universitas Teknologi Sumbawa</small></div></div>
    <div class="who"><div class="bellwrap"><button class="bell" data-act="bell" aria-label="Notifikasi" aria-expanded="${!!S.bell}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>${unread()?`<span class="badge">${unread()}</span>`:""}</button>${S.bell?popup():""}</div>${S.user.role==="admin"?`<strong>Admin</strong>`:`${avatar(S.user,34)}<span class="pill p-n">${ROLE[S.user.role]}</span><strong>${esc(S.user.nama)}</strong>`}
      <button class="btn" data-act="logout">Keluar</button></div>
  </header>
  <div class="layout">
    <nav aria-label="Menu">${tabs.map(([k,l])=>`<button class="${k===S.tab?"on":""}${kunci&&k!=="profil"?" lock":""}" data-tab="${k}" ${kunci&&k!=="profil"?'aria-disabled="true" title="Lengkapi Identitas Diri terlebih dahulu"':""}>${l}</button>`).join("")}</nav>
    <main>${viewFor(S.user.role,S.tab)()}</main>
  </div>`;
}

function viewFor(role,tab){
  if(role==="admin"&&tab==="akun") return ()=>VIEWS["admin:akun"]()+identitasView();
  if(role==="admin") return VIEWS["kaprodi:"+tab]||VIEWS["admin:"+tab];
  return VIEWS[role+":"+tab];
}
function loginView(){
  const roles=Object.entries(ROLE).map(([k,l])=>`<option value="${k}" ${S.loginRole===k?"selected":""}>${l}</option>`).join("");
  const head=`<header style="text-align:center;display:grid;gap:8px"><img class="logo big" src="${LOGO_FULL}" alt="Logo Universitas Teknologi Sumbawa"><div><h1>E-SKRIPSI</h1><small style="color:var(--muted)">Sistem Pendataan Skripsi Program Studi</small></div></header>`;
  if(S.layar==="memuat") return head+`<div class="login"><section class="panel"><p class="note" style="text-align:center">Memuat…</p></section></div>`;
  if(S.layar==="gagal") return head+`<div class="login"><section class="panel"><h2>Belum tersambung</h2><p>${esc(S.galat||"Tidak dapat terhubung ke server.")}</p><button class="btn pri" data-act="ulangi">Coba Lagi</button></section></div>`;
  if(S.layar==="config") return head+`<div class="login"><section class="panel"><h2>Aplikasi belum disambungkan</h2><p>Isi alamat proyek dan kunci Supabase pada berkas <span class="mono">config.js</span>, lalu muat ulang halaman ini. Langkahnya ada di berkas README.</p></section></div>`;
  if(S.layar==="setup") return head+`<div class="login"><section class="panel">
      <h2>Buat Akun Admin Pertama</h2>
      <p>Belum ada akun di aplikasi ini. Akun yang dibuat di sini menjadi Admin. Langkah ini hanya muncul satu kali.</p>
      <form id="fSetup">
        <label>Nama lengkap<input id="st_nama" required></label>
        <label>Username<input id="st_user" required pattern="[A-Za-z0-9._\\-]{3,40}" title="3–40 karakter: huruf, angka, titik, garis bawah, tanda hubung" autocomplete="username"></label>
        <label>Password<input id="st_pass" type="password" required minlength="6" autocomplete="new-password"></label>
        <label>Ulangi password<input id="st_ulang" type="password" required minlength="6" autocomplete="new-password"></label>
        <p class="note">Minimal 6 karakter. Catat baik-baik: password tidak bisa dilihat kembali.</p>
        <button class="btn pri">Buat Akun Admin</button>
      </form></section></div>`;
  if(S.reg) return head+`<div class="login"><section class="panel">
      <h2>Daftar Akun Mahasiswa</h2>
      <p>Isi data diri. Admin akan memeriksa dan membuatkan username serta password.</p>
      <form id="fReg">
        <label>Nama lengkap<input id="rn" required></label>
        <div class="grid2"><label>NIM<input id="rnim" required pattern="[0-9]{8,12}" title="8–12 digit angka"></label>
        <label>Angkatan<input id="ra" required placeholder="2022"></label></div>
        <label>Email<input id="re" type="email" required></label>
        <label>No. HP<input id="rh" required></label>
        <button class="btn pri">Kirim Pendaftaran</button>
      </form>
      <p class="note" style="text-align:center">Sudah punya akun? <button class="link" data-act="toLogin">Masuk di sini</button></p>
    </section></div>`;
  return head+`<div class="login"><section class="panel">
      <h2>Masuk</h2>
      <form id="fLogin">
        <label>Masuk sebagai<select id="lr">${roles}</select></label>
        <label>Username<input id="lu" required autocomplete="username"></label>
        <label>Password<span class="pw"><input id="lp" type="password" required autocomplete="current-password"><button type="button" class="eye" data-act="eye" aria-label="Tampilkan password" title="Tampilkan password"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg></button></span></label>
        <button class="btn pri">Masuk</button>
      </form>
      <p class="note" style="text-align:center">Mahasiswa belum punya akun? <button class="link" data-act="toReg">Daftar di sini</button></p>
    </section></div>`;
}

const VIEWS = {

  "admin:akun":()=>{
    const pend=S.akunReq.filter(r=>r.status==="menunggu"), tolak=S.akunReq.filter(r=>r.status==="ditolak");

    const all=S.users.filter(u=>(fr==="all"||u.role===fr)&&(fs==="all"||(fs==="nonaktif")===!!u.nonaktif)&&(!q||[u.nama,u.username,u.nim,u.nidn,u.nip].some(x=>x&&String(x).toLowerCase().includes(q))));
    const pages=Math.max(1,Math.ceil(all.length/PER)), pg=Math.min(S.pgAkun||1,pages), list=all.slice((pg-1)*PER,pg*PER);
    const no=u=>u.nim||u.nidn||u.nip||"—";
    return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>Manajemen Akun</h2>${pend.length?`<span class="pill p-warn">${pend.length} menunggu persetujuan</span>`:""}</div>

    ${pend.length?pend.map(r=>`
      <form class="panel" data-akun="${r.id}" style="background:var(--bg)">
        <div class="row" style="justify-content:space-between"><h3>${esc(r.nama)}</h3>${pill(r.status)}</div>
        <div class="row note"><span class="mono">NIM ${esc(r.nim)}</span>· Angkatan ${esc(r.angkatan)} · ${esc(r.email)} · ${esc(r.hp)} · diajukan ${r.tgl}</div>
        <div class="grid2"><label>Username<input id="u${r.id}" value="${esc(r.nim)}" required></label>
        <label>Password awal<input id="p${r.id}" value="skripsi${esc(r.nim.slice(-4))}" required></label></div>
        <div class="row"><button class="btn pri">Setujui & Buat Akun</button><button type="button" class="btn bad" data-tolak-akun="${r.id}">Tolak</button></div>
      </form>`).join(""):`<div class="empty">Tidak ada pendaftaran akun yang menunggu.</div>`}
    ${tolak.length?`<p class="note">Ditolak: ${tolak.map(r=>`${esc(r.nama)} (${esc(r.nim)})`).join(", ")}</p>`:""}
    </section>
    <section class="panel"><h3>Tambah Akun</h3>
    <p>Buat akun langsung tanpa pendaftaran, misalnya untuk dosen baru.</p>
    <form id="fAkunBaru">
      <div class="grid2">
        <label>Peran<select id="ak_role">${["mahasiswa","dosen","admin"].map(k=>`<option value="${k}" ${(S.akRole||"dosen")===k?"selected":""}>${ROLE[k]}</option>`).join("")}</select></label>
        <label>Nama lengkap<input id="ak_nama" required></label>
        <label>${{mahasiswa:"NIM",dosen:"NIDN"}[S.akRole||"dosen"]||"NIP"}<input id="ak_no" required inputmode="numeric"></label>
        <label>Email<input id="ak_email" type="email"></label>
        <label>Username<input id="ak_user" required></label>
        <label>Password awal<input id="ak_pass" required></label>
      </div>
      <div class="row"><button class="btn pri">Tambah Akun</button></div>
    </form></section>
    <section class="panel"><div class="row" style="justify-content:space-between"><div><h3>Daftar Akun</h3><span class="note">Reset mengembalikan password ke default, yaitu nomor induk (NIM, NIDN, atau NIP) pemilik akun.</span></div>
      <div class="row"><input id="f_cari" type="search" placeholder="Cari nama, username, atau nomor induk" value="${esc(S.cari||"")}" style="width:auto;min-width:230px">
      <select id="f_stat" style="width:auto" aria-label="Status"><option value="all">Semua status</option><option value="aktif" ${fs==="aktif"?"selected":""}>Aktif</option><option value="nonaktif" ${fs==="nonaktif"?"selected":""}>Nonaktif</option></select>
      <select id="f_role" style="width:auto" aria-label="Peran"><option value="all">Semua (${S.users.length})</option>${Object.entries(ROLE).map(([k,l])=>`<option value="${k}" ${fr===k?"selected":""}>${l} (${S.users.filter(u=>u.role===k).length})</option>`).join("")}</select></div></div>
    <div class="tbl"><table><thead><tr><th>Nama</th><th>Peran</th><th>NIM / NIDN / NIP</th><th>Username</th><th>Password</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
    ${list.map(u=>`<tr><td><div class="row" style="flex-wrap:nowrap">${avatar(u,30)}<strong>${esc(u.nama)}</strong></div></td><td><span class="pill p-n">${ROLE[u.role]}</span></td><td class="mono">${esc(no(u))}</td><td class="mono">${esc(u.username)}</td>
      <td>${u.pwReset?`<span class="mono pwd">${esc(u.password)}</span><div class="note">Default, direset ${u.pwReset}</div>`:`<span class="mono note">••••••••</span>`}</td>
      <td>${u.nonaktif?`<span class="pill p-bad">Nonaktif</span>`:`<span class="pill p-ok">Aktif</span>`}</td>
      <td>${u.id===S.user.id?`<span class="note">Akun Anda</span>`:`<div class="row"><button class="btn" data-resetpw="${u.id}">Reset Password</button><button class="btn" data-toggleakun="${u.id}">${u.nonaktif?"Aktifkan":"Nonaktifkan"}</button><button class="btn bad" data-hapusakun="${u.id}">Hapus</button></div>
        ${S.delId===u.id?`<div class="confirm">Hapus akun <strong>${esc(u.username)}</strong> secara permanen?<div class="row"><button class="btn bad" data-yahapus="${u.id}">Ya, Hapus</button><button class="btn" data-act="bataldel">Batal</button></div></div>`:""}`}</td></tr>`).join("")||`<tr><td colspan="7"><div class="empty">Tidak ada akun yang cocok.</div></td></tr>`}
    </tbody></table></div>
    <div class="row" style="justify-content:space-between"><span class="note">Menampilkan ${all.length?(pg-1)*PER+1:0}–${Math.min(pg*PER,all.length)} dari ${all.length} akun</span>
      <div class="row"><button class="btn" data-pg="${pg-1}" ${pg<=1?"disabled":""}>Sebelumnya</button><span class="mono note">${pg} / ${pages}</span><button class="btn" data-pg="${pg+1}" ${pg>=pages?"disabled":""}>Berikutnya</button></div></div>
    </section>`;
  },
  "kaprodi:daftar":()=>{
    const pend=S.skripsi.filter(s=>s.status==="menunggu");
    return `<section class="panel"><h2>Persetujuan Pendaftaran Skripsi</h2>
    <p>Periksa judul dan syarat akademik mahasiswa sebelum menyetujui.</p>
    ${pend.length?`<div class="tbl"><table><thead><tr><th>Mahasiswa</th><th>Judul & Bidang</th><th>IPK / SKS</th><th>Aksi</th></tr></thead><tbody>
    ${pend.map(s=>{const m=U(s.mhsId);return `<tr><td><strong>${esc(m.nama)}</strong><div class="mono">${m.nim}</div></td>
      <td>${esc(s.judul)}<div class="note">${esc(s.bidang)} · diajukan ${s.tgl}</div></td>
      <td class="mono">${s.ipk} / ${s.sks}</td>
      <td><div class="row"><button class="btn pri" data-acc="${s.id}">Setujui</button><button class="btn bad" data-rej="${s.id}">Tolak</button></div></td></tr>`}).join("")}
    </tbody></table></div>`:`<div class="empty">Semua pendaftaran sudah diproses.</div>`}</section>`;
  },
  "admin:tim":()=>timView(), "kaprodi:tim":()=>timView()+grafikView(),
  "admin:rekap":()=>rekapView(), "admin:periode":periodeView, "admin:dokumen":dokumenView, "dosen:dokumen":dokumenView, "mahasiswa:dokumen":dokumenView, "kaprodi:arsip":arsipView, "mahasiswa:acc":accMhsView, "dosen:acc":accDosenView, "kaprodi:acc":accAdminView, "mahasiswa:survey":surveyMhsView, "kaprodi:survey":surveyAdminView, "mahasiswa:jadwal":()=>jadwalMhsView("proposal"), "dosen:jadwal":()=>jadwalDosenView("proposal"), "kaprodi:jadwal":()=>jadwalAdminView("proposal"), "mahasiswa:proposal":()=>propMhsView("proposal"), "dosen:proposal":()=>propDosenView("proposal"), "kaprodi:proposal":()=>propAdminView("proposal"),
  "mahasiswa:jadwalsidang":()=>jadwalMhsView("sidang"), "dosen:jadwalsidang":()=>jadwalDosenView("sidang"), "kaprodi:jadwalsidang":()=>jadwalAdminView("sidang"), "mahasiswa:sidang":()=>propMhsView("sidang"), "dosen:sidang":()=>propDosenView("sidang"), "kaprodi:sidang":()=>propAdminView("sidang"), "admin:identitas":identitasView, "admin:pelaksanaan":pelaksanaanView, "kaprodi:pelaksanaan":pelaksanaanView, "kaprodi:profil":profilView, "dosen:profil":profilView, "mahasiswa:profil":profilView, "kaprodi:rekap":()=>grafikView()+rekapView(),
  "dosen:bimbingan":()=>dosenTugas("bimbingan"), "dosen:penguji":()=>dosenTugas("penguji"),
  "dosen:tugasLama":()=>{
    const mine=S.skripsi.flatMap(s=>s.tim.filter(t=>t.dosenId===S.user.id).map(t=>({s,t})));
    const list=(title,arr)=>`<section class="panel"><div class="row" style="justify-content:space-between"><h2>${title}</h2><span class="pill p-n">${arr.length} mahasiswa</span></div>
      ${arr.length?`<div class="tbl"><table><thead><tr><th>Mahasiswa</th><th>Judul</th><th>Peran</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
      ${arr.map(({s,t})=>{const m=U(s.mhsId);return `<tr><td><strong>${esc(m.nama)}</strong><div class="mono">${m.nim}</div></td><td>${esc(s.judul)}</td><td>${t.peran}</td><td>${pill(t.status)}</td>
      <td>${t.status==="menunggu"?`<div class="row"><button class="btn pri" data-terima="${s.id}">Terima</button><button class="btn bad" data-tolakd="${s.id}">Tolak</button></div>`:`<span class="note">—</span>`}</td></tr>`}).join("")}
      </tbody></table></div>`:`<div class="empty">Belum ada mahasiswa.</div>`}</section>`;
    return list("Sebagai Pembimbing",mine.filter(x=>x.t.peran==="Pembimbing"))+list("Sebagai Penguji",mine.filter(x=>x.t.peran!=="Pembimbing"));
  },
  "dosen:notif":()=>{
    const n=S.notif.filter(x=>x.to===S.user.id);
    const html=`<section class="panel"><h2>Notifikasi</h2><div class="notif">${n.length?n.map(x=>`<div class="${x.baru?"new":""}">${esc(x.msg)}<time>${x.t}</time></div>`).join(""):`<div class="empty">Belum ada notifikasi.</div>`}</div></section>`;
    n.forEach(x=>x.baru=false); return html;
  },
  "mahasiswa:status":()=>{
    const s=S.skripsi.find(x=>x.mhsId===S.user.id);
    const pa=periodeAktif();
    if((!s||s.status==="ditolak")&&!pa) return `<section class="panel"><h2>Pendaftaran Skripsi</h2><div class="empty">Periode pendaftaran skripsi sedang ditutup. Pantau notifikasi untuk informasi pembukaan periode berikutnya.</div></section>`;
    if(!s||s.status==="ditolak") return `<section class="panel"><h2>Pendaftaran Skripsi</h2>
      <div class="cred">Periode ${pa.ta} Semester ${pa.sem} · dibuka sampai ${tglID(pa.tutup)}</div>
      ${s?`<p style="color:var(--bad)">Pendaftaran sebelumnya ditolak Admin. Silakan perbaiki dan ajukan ulang.</p>`:`<p>Anda belum terdaftar sebagai mahasiswa skripsi. Lengkapi formulir berikut.</p>`}
      <form id="fSkripsi">
        <label>Judul usulan<textarea id="sj" rows="2" required></textarea></label>
        <div class="grid2"><label>Bidang kajian<select id="sb"><option>Sistem Informasi</option><option>Rekayasa Perangkat Lunak</option><option>Kecerdasan Buatan</option><option>Jaringan Komputer</option></select></label>
        <label>IPK<input id="si" required inputmode="decimal" placeholder="3.25"></label>
        <label>SKS lulus<input id="ss" required inputmode="numeric" placeholder="130"></label></div>
        <button class="btn pri">Ajukan Pendaftaran</button>
      </form></section>`;
    const allOk=s.tim.length===3&&s.tim.every(t=>t.status==="diterima");
    const st=[["Pendaftaran diajukan",true],["Disetujui Admin",s.status==="disetujui"],["Dosen ditetapkan",s.tim.length===3],["Seluruh dosen menerima",allOk]];
    const cur=st.findIndex(x=>!x[1]);
    return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>Skripsi Saya</h2>${pill(s.status)}</div>
      <div class="note">${(p=>p?`Periode ${p.ta} Semester ${p.sem}`:"")(S.periode.find(p=>p.id===s.periodeId))}</div><div><div class="label">Judul</div><strong>${esc(s.judul)}</strong><div class="note">${esc(s.bidang)} · IPK ${s.ipk} · ${s.sks} SKS</div></div>
      ${s.status==="disetujui"?(judulTerkunci(s)?`<p class="note">Judul tidak bisa diubah lagi karena naskah sudah disetujui dosen.</p>`
        :S.editJudul?`<form id="fJudul"><label>Judul baru<textarea id="jd_baru" rows="3" required>${esc(s.judul)}</textarea></label>
          <p class="note">Pembimbing, kedua penguji, dan Admin akan mendapat pemberitahuan. Judul baru dipakai pada undangan dan Halaman Pengesahan yang dibuat setelah ini.</p>
          <div class="row"><button class="btn pri">Simpan Judul</button><button type="button" class="btn" data-act="bataljudul">Batal</button></div></form>`
        :`<div class="row"><button class="btn" data-act="ubahjudul">Ubah Judul</button></div>`):""}
      ${s.judulLama&&s.judulLama.length?`<details><summary class="note">Riwayat judul (${s.judulLama.length})</summary><ol class="note" style="margin:8px 0 0;padding-left:20px">${s.judulLama.map(x=>`<li>${esc(x.judul)} <span class="mono">(sampai ${x.tgl})</span></li>`).join("")}</ol></details>`:""}
      ${s.status==="disetujui"?`<div class="cred"><strong>Tahap saat ini:</strong> ${TAHAP[tahapOf(s)]}</div>`:""}
      <ol class="steps">${st.map(([t,d],i)=>`<li><span class="dot ${d?"done":i===cur?"cur":""}">${d?"✓":i+1}</span><span>${t}</span></li>`).join("")}</ol></section>
      <section class="panel"><h2>Dosen Pembimbing & Penguji</h2>
      ${s.tim.length?`<div class="tbl"><table><thead><tr><th>Peran</th><th>Dosen</th><th>Status</th></tr></thead><tbody>${s.tim.map(t=>`<tr><td>${t.peran}</td><td>${esc(U(t.dosenId).nama)}</td><td>${pill(t.status)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Dosen belum ditetapkan.</div>`}</section>`;
  },
};

function avatar(u,size){
  const ini=u.nama.replace(/^(Dr\.|Hj\.|H\.)\s*/g,"").split(/[\s,]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  return u.foto?`<img class="ava" src="${u.foto}" alt="Foto ${esc(u.nama)}" style="width:${size}px;height:${size}px">`:`<span class="ava" style="width:${size}px;height:${size}px;font-size:${size*.38}px">${ini}</span>`;
}
function profilView(){

  const idf=r==="mahasiswa"?f("pf_nim","NIM",u.nim,"readonly"):r==="dosen"?f("pf_nidn","NIDN",u.nidn,"readonly"):f("pf_nip","NIP",u.nip,"readonly");
  const jk=`<label>Jenis kelamin<select id="pf_jk" ${u.role==="dosen"||u.role==="mahasiswa"?"required":""}><option value="">— pilih —</option>${["Laki-laki","Perempuan"].map(x=>`<option ${u.jk===x?"selected":""}>${x}</option>`).join("")}</select></label>`;
  const extra=r==="mahasiswa"
    ? f("pf_angkatan","Angkatan",u.angkatan)+`<label>Program studi<input value="Teknik Elektro" readonly></label>`
    : `<label>Jabatan fungsional<select id="pf_jabatan"><option value="">— pilih —</option>${["Asisten Ahli","Lektor","Lektor Kepala","Guru Besar"].map(x=>`<option ${u.jabatan===x?"selected":""}>${x}</option>`).join("")}</select></label>`+f("pf_keahlian","Bidang keahlian",u.keahlian);
  const kr=kurang(u), req=(r==="dosen"||r==="mahasiswa")?"required":"";
  return `<section class="panel"><h2>Identitas Diri</h2>
  ${kr.length?`<div class="confirm"><strong>Lengkapi identitas diri Anda terlebih dahulu.</strong> Menu lain terbuka setelah data berikut diisi dan disimpan: ${kr.join(", ")}.</div>`:""}
  <form id="fProfil">
    <div class="prof">
      <div class="fotobox">${avatar(u,132)}
        <label class="btn" for="pf_foto" style="display:inline-block;text-align:center">${u.foto?"Ganti Foto":"Unggah Foto"}</label>
        <input id="pf_foto" type="file" accept="image/png,image/jpeg" hidden>
        ${u.foto?`<button type="button" class="link" data-act="hapusfoto">Hapus foto</button>`:""}
        <span class="note">JPG/PNG, maks. 2 MB. Foto formal, latar polos.</span>

      <div style="display:grid;gap:12px;min-width:0">
        <div class="label">Data pribadi</div>

        <div class="grid2">${idf}${jk}
          ${f("pf_tlahir","Tempat lahir",u.tlahir,req)}${f("pf_tgllahir","Tanggal lahir",u.tgllahir,'type="date" '+req)}</div>
        <div class="label">${r==="mahasiswa"?"Akademik":"Kepegawaian"}</div>
        <div class="grid2">${extra}</div>
        <div class="label">Kontak</div>
        <div class="grid2">${f("pf_email","Email",u.email,'type="email" '+req)}${f("pf_hp","No. HP / WhatsApp",u.hp,req)}</div>
        <label>Alamat<textarea id="pf_alamat" rows="2">${esc(u.alamat||"")}</textarea></label>
        <div class="row"><button class="btn pri">Simpan Identitas</button></div>
      </div>
    </div>
  </form></section>`+sandiView();
}
function sandiView(){const u=S.user;
  return `<section class="panel"><h2>Ganti Password</h2>
  ${u.pwReset?`<div class="cred">Password Anda direset Admin ke password default. Segera ganti dengan password baru.</div>`:""}

async function panggil(aksi,data){
  let res;
  try{const h={"Content-Type":"application/json",apikey:CFG.key};if(/^eyJ/.test(CFG.key))h.Authorization="Bearer "+CFG.key;
    res=await fetch(CFG.url.replace(/\/+$/,"")+"/rest/v1/rpc/api",{method:"POST",headers:h,body:JSON.stringify({token:TOKEN,aksi,data:data||{}})})}
  catch(_){return {ok:false,jaringan:true,pesan:"Tidak dapat terhubung ke server. Periksa koneksi internet Anda."}}
  let j=null;try{j=await res.json()}catch(_){}
  if(!res.ok)return {ok:false,jaringan:true,pesan:res.status===404?"Database belum disiapkan. Jalankan berkas eskripsi.sql di Supabase.":res.status===401||res.status===403?"Kunci Supabase di config.js tidak diterima.":"Server sedang bermasalah. Coba lagi sebentar lagi."};
  return j||{ok:false,pesan:"Jawaban server tidak dikenali"};
}
function terapkan(st){
  TANDA=JSON.stringify(st);
  for(const k of ["users","akunReq","skripsi","proposal","sidang","notif","periode","dokumen"])S[k]=st[k]||[];
  S.pejabat=st.pejabat||{dekan:"",dekanNidn:"",kp:"",kpNidn:""};
  S.users.forEach(u=>{if(u.adaFoto&&FOTO[u.id])u.foto=FOTO[u.id]});
  S.user=U(st.me)||null;
  const perlu=S.users.filter(u=>u.adaFoto&&!FOTO[u.id]&&!FOTO_MINTA[u.id]).map(u=>u.id).slice(0,60);
  if(perlu.length){perlu.forEach(i=>FOTO_MINTA[i]=1);panggil("foto_ambil",{ids:perlu}).then(r=>{if(!r.ok||!r.foto)return;Object.assign(FOTO,r.foto);S.users.forEach(u=>{if(FOTO[u.id])u.foto=FOTO[u.id]});if(S.user&&!mengetik())renderKeep()})}
}

  if(SIBUK)return false;SIBUK=true;document.body.classList.add("sibuk");
  const r=await panggil(aksi,data);
  SIBUK=false;document.body.classList.remove("sibuk");
  if(r.sesi===false){keluarLokal();render();toast(r.pesan||"Sesi berakhir. Silakan masuk kembali.");return false}
  if(r.token)setToken(r.token);
  if(r.state)terapkan(r.state);
  if(r.ok){(ids||[]).forEach(id=>delete KETIK[id]);render()}else renderKeep();
  if(r.pesan)toast(r.pesan);
  return !!r.ok;
}
async function segarkan(){
  if(!S.user||SIBUK||document.hidden)return;
  const r=await panggil("muat");
  if(r.sesi===false){keluarLokal();render();return toast(r.pesan||"Sesi berakhir. Silakan masuk kembali.")}
  if(!r.ok||!r.state||SIBUK||!S.user)return;
  if(JSON.stringify(r.state)===TANDA)return;
  if(mengetik()){TUNDA=r.state;return}
  terapkan(r.state);renderKeep();
}
function bacaSemua(){if(!S.notif.some(x=>x.baru))return;S.notif.forEach(x=>x.baru=false);panggil("notif_baca").then(r=>{if(r.ok&&r.state)TANDA=JSON.stringify(r.state)})}
async function mulai(){
  if(!CFG.url||!CFG.key||/GANTI|xxxx/i.test(CFG.url+CFG.key)){S.layar="config";return render()}
  S.layar="memuat";render();
  if(TOKEN){const r=await panggil("muat");
    if(r.ok&&r.state){terapkan(r.state);S.layar=null;return render()}
    if(r.jaringan){S.layar="gagal";S.galat=r.pesan;return render()}
    setToken(null)}
  const r=await panggil("status");
  if(!r.ok){S.layar="gagal";S.galat=r.pesan;return render()}
  S.layar=r.adaAdmin?null:"setup";render();
}
function kecilkanFoto(file){return new Promise((ok,gagal)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const m=240,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);gagal()};img.src=url})}

document.addEventListener("click",async e=>{
  if(S.bell&&!e.target.closest(".bellwrap")){bacaSemua();S.bell=false;renderKeep();return}
  const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
  if(d.act==="ulangi")return mulai();
  if(d.act==="logout"){if(SIBUK)return;panggil("keluar");keluarLokal();return render()}
  if(d.act==="bell"){if(S.bell)bacaSemua();S.bell=!S.bell;return renderKeep()}
  if(d.act==="hapusfoto"){if(await kirim("foto",{foto:null})){delete FOTO[S.user.id];delete S.user.foto;render()}return}
  if(d.buka||d.tutup||d.bukalagi)return kirim("periode_aksi",{id:d.buka||d.tutup||d.bukalagi,aksi:d.buka?"buka":d.tutup?"tutup":"bukalagi"});
  if(d.akses)return kirim("periode_akses",{jenis:d.akses});
  if(d.accdsn){
    if(d.aksi==="batal")return kirim("acc",{id:d.accdsn,aksi:"batal"});
    const cid="acc_cat_"+d.accdsn,cat=document.getElementById(cid).value.trim(),ok=d.aksi==="setuju";
    if(!ok&&!cat)return toast("Isi catatan agar mahasiswa tahu bagian yang perlu direvisi");
    return kirim("acc",{id:d.accdsn,aksi:ok?"setuju":"revisi",cat},[cid])}
  if(d.act==="unduhsurvey")return unduhSurvey();
  if(d.act==="ubahjudul"||d.act==="bataljudul"){S.editJudul=d.act==="ubahjudul";return render()}
  if(d.batalsv){S.batalSvId=+d.batalsv;return render()}
  if(d.act==="tidakbatalsv"){S.batalSvId=null;return render()}
  if(d.yabatalsv){S.batalSvId=null;if(S.sahId==d.yabatalsv)S.sahId=null;return kirim("survey_batal",{id:d.yabatalsv})}
  if(d.ubahdok){S.dokEdit=+d.ubahdok;S.dokDel=null;for(const k of ["dk_nama","dk_link","dk_ket"])delete KETIK[k];return render()}
  if(d.hapusdok){S.dokDel=+d.hapusdok;return render()}
  if(d.act==="bataldok"){S.dokEdit=null;S.dokDel=null;for(const k of ["dk_nama","dk_link","dk_ket"])delete KETIK[k];return render()}
  if(d.yahapusdok){S.dokDel=null;if(S.dokEdit==d.yahapusdok)S.dokEdit=null;return kirim("dokumen_hapus",{id:d.yahapusdok})}
  if(d.sah){S.sahId=S.sahId==d.sah?null:+d.sah;return render()}
  if(d.unduhsah)return unduhPengesahan(d.unduhsah);
  if(d.arsip)return kirim("arsip",{id:d.arsip});
  if(d.act==="arsipsemua")return kirim("arsip",{semua:true});
  if(d.bukaarsip)return kirim("arsip_buka",{id:d.bukaarsip});
  if(d.unduharsip)return unduhArsip(d.unduharsip);
  if(d.ftahap!==undefined){S.fTahap=d.ftahap==="all"?"all":+d.ftahap;return render()}
  if(d.resetpw)return kirim("akun_reset",{id:d.resetpw});
  if(d.pg){S.pgAkun=+d.pg;S.delId=null;return render()}
  if(d.act==="bataldel"){S.delId=null;return render()}
  if(d.hapusakun){const u=U(+d.hapusakun);
    if(u.id===S.user.id)return toast("Akun yang sedang Anda pakai tidak bisa dihapus");
    const pakai=u.role==="mahasiswa"?S.skripsi.some(x=>x.mhsId===u.id):u.role==="dosen"?S.skripsi.some(x=>x.tim.some(t=>t.dosenId===u.id)):false;
    if(pakai)return toast(u.role==="mahasiswa"?"Akun ini punya data skripsi, jadi tidak bisa dihapus. Nonaktifkan saja.":"Dosen ini masih tercatat sebagai pembimbing/penguji, jadi tidak bisa dihapus. Nonaktifkan saja.");
    S.delId=u.id;return render()}
  if(d.yahapus){S.delId=null;return kirim("akun_hapus",{id:d.yahapus})}
  if(d.toggleakun)return kirim("akun_toggle",{id:d.toggleakun});
  if(d.act==="unduhxlsx")return unduhIdentitas();
  if(d.ftim){S.fTim=d.ftim;S.aturTim=null;return render()}
  if(d.aturtim){S.aturTim=S.aturTim==d.aturtim?null:+d.aturtim;return render()}
  if(d.fjd){S["fJd_"+d.k]=d.fjd;S.aturId=null;return render()}
  if(d.aturjd){S.aturId=S.aturId==d.aturjd?null:+d.aturjd;S.undId=null;return render()}
  if(d.unduhpd)return unduhPendaftar(d.unduhpd);
  if(d.unduhund)return unduhUndangan(d.unduhund);
  if(d.und){S.undId=S.undId==d.und?null:+d.und;return render()}
  if(d.hapusjadwal)return kirim("jadwal_hapus",{id:d.hapusjadwal});
  if(d.batalprop)return kirim("daftar_batal",{id:d.batalprop});
  if(d.prop){const cid="cat_"+d.prop,cat=document.getElementById(cid).value.trim(),ok=d.aksi==="setuju";
    if(!ok&&!cat)return toast("Isi catatan agar mahasiswa tahu apa yang perlu diperbaiki");
    return kirim("daftar_putus",{id:d.prop,setuju:ok,cat},[cid])}
  if(d.act==="readall"){bacaSemua();return renderKeep()}
  if(d.act==="eye"){const i=document.getElementById(b.dataset.untuk||"lp"),show=i.type==="password";i.type=show?"text":"password";b.classList.toggle("on",show);b.setAttribute("aria-label",show?"Sembunyikan password":"Tampilkan password");b.title=b.getAttribute("aria-label");return}
  if(d.act==="toReg"||d.act==="toLogin"){S.reg=d.act==="toReg";return render()}
  if(d.tab){if(d.tab!=="profil"&&kurang(S.user).length)return toast("Lengkapi Identitas Diri terlebih dahulu");S.tab=d.tab;S.bell=false;return render()}
  if(d.tolakAkun)return kirim("akun_tolak",{id:d.tolakAkun});
  if(d.acc||d.rej)return kirim("skripsi_putus",{id:d.acc||d.rej,setuju:!!d.acc});
  if(d.terima||d.tolakd)return kirim("tim_jawab",{id:d.terima||d.tolakd,terima:!!d.terima});
});
const cariUlang=(id,kunci,extra)=>e=>{if(e.target.id!==id)return;S[kunci]=e.target.value;if(extra)extra();const pos=e.target.selectionStart;render();const el=document.getElementById(id);el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}};
document.addEventListener("input",cariUlang("ar_cari","cariArsip"));
document.addEventListener("input",cariUlang("id_cari","cariId"));
document.addEventListener("input",cariUlang("f_cari","cari",()=>{S.pgAkun=1}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.bell){bacaSemua();S.bell=false;renderKeep()}});
document.addEventListener("input",e=>{const t=e.target;if(t.id&&(t.tagName==="TEXTAREA"||(t.tagName==="INPUT"&&["text","url","email","tel","number"].includes(t.type))))KETIK[t.id]=t.value});
const svSimpan=e=>{const t=e.target;if(t&&t.closest&&t.closest("#fSurvey")){S.svDraft=S.svDraft||{};S.svDraft[t.type==="radio"?t.name:t.id]=t.value}};
document.addEventListener("input",svSimpan);
document.addEventListener("focusout",()=>{setTimeout(()=>{if(TUNDA&&!mengetik()&&!SIBUK&&S.user){const st=TUNDA;TUNDA=null;terapkan(st);renderKeep()}},300)});
document.addEventListener("change",async e=>{svSimpan(e);
  if(e.target.id==="f_role"){S.fRole=e.target.value;S.pgAkun=1;return render()}
  if(e.target.id==="id_role"){S.fId=e.target.value;return render()}
  if(e.target.id==="ar_per"){S.fArsip=e.target.value;return render()}
  if(e.target.id==="sv_per"){S.fSv=e.target.value;return render()}
  if(e.target.id==="f_stat"){S.fStat=e.target.value;S.pgAkun=1;return render()}
  if(e.target.id==="ak_role"){S.akRole=e.target.value;return renderKeep()}
  if(e.target.classList.contains("dt")){const p=S.periode.find(x=>x.id==e.target.dataset.pid),f=e.target.dataset.f,val=e.target.value;
    const nb=f==="buka"?val:p.buka, nt=f==="tutup"?val:p.tutup;
    if(!val||nt<nb){toast("Tanggal ditutup harus sama atau setelah tanggal dibuka");return render()}
    if(!await kirim("periode_tanggal",{id:p.id,f,nilai:val}))render();return}
  if(e.target.id==="pf_foto"){const file=e.target.files[0];if(!file)return;
    if(!/^image\/(png|jpeg)$/.test(file.type))return toast("Format foto harus JPG atau PNG");
    if(file.size>2*1024*1024)return toast("Ukuran foto melebihi 2 MB");
    let foto;try{foto=await kecilkanFoto(file)}catch(_){return toast("Foto tidak dapat dibaca")}
    const id=S.user.id;if(await kirim("foto",{foto})){FOTO[id]=foto;if(S.user){S.user.foto=foto;S.user.adaFoto=true}renderKeep()}return}
  if(e.target.id==="lr"){S.loginRole=e.target.value;renderKeep()}});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target, v=id=>document.getElementById(id).value.trim();
  const ids=[...f.querySelectorAll("[id]")].map(x=>x.id), linkOk=l=>/^https?:\/\/\S+\.\S+/.test(l);
  if(f.id==="fLogin"){resetUI();return kirim("masuk",{username:v("lu"),sandi:document.getElementById("lp").value,role:v("lr")},ids)}
  if(f.id==="fSetup"){const s=document.getElementById("st_pass").value;
    if(s!==document.getElementById("st_ulang").value)return toast("Pengulangan password tidak sama");
    if(await kirim("setup",{nama:v("st_nama"),username:v("st_user"),sandi:s},ids)){S.layar=null;resetUI();render()}return}
  if(f.id==="fReg"){if(await kirim("daftar_akun",{nama:v("rn"),nim:v("rnim"),angkatan:v("ra"),email:v("re"),hp:v("rh")},ids)){S.reg=false;render()}return}
  if(f.dataset.akun){const id=f.dataset.akun;return kirim("akun_setujui",{id,username:v("u"+id),sandi:v("p"+id)},ids)}
  if(f.id==="fAkunBaru")return kirim("akun_tambah",{role:v("ak_role"),nama:v("ak_nama"),nomor:v("ak_no"),email:v("ak_email"),username:v("ak_user"),sandi:v("ak_pass")},ids);
  if(f.dataset.hasil){const id=f.dataset.hasil,nilai=v("hs_nilai_"+id),cat=v("hs_cat_"+id),link=v("hs_link_"+id);
    if(!nilai)return toast("Pilih hasil pelaksanaan terlebih dahulu");
    if(link&&!linkOk(link))return toast("Link harus diawali http:// atau https://");
    if(nilai==="ulang"&&!cat)return toast("Isi catatan agar mahasiswa tahu alasan harus mengulang");
    if(await kirim("hasil_simpan",{id,nilai,cat,link},ids)&&nilai==="ulang"){S.aturId=null;render()}return}
  if(f.dataset.jadwal){const id=f.dataset.jadwal,tgl=v("jd_tgl_"+id);
    if(tgl<isoToday())return toast("Tanggal yang dipilih sudah lewat");
    return kirim("jadwal_simpan",{id,tgl,jam:v("jd_jam_"+id),ruang:v("jd_ruang_"+id)},ids)}
  if(f.dataset.daftar){const link=v("pr_link");
    if(!linkOk(link))return toast("Link harus diawali http:// atau https://");
    return kirim("daftar_kirim",{jenis:f.dataset.daftar,link,ket:v("pr_ket")},ids)}
  if(f.id==="fNaskah"){const link=v("ns_link");
    if(!linkOk(link))return toast("Link harus diawali http:// atau https://");
    return kirim("naskah_kirim",{link},ids)}
  if(f.id==="fDokumen"){const link=v("dk_link");
    if(!linkOk(link))return toast("Link harus diawali http:// atau https://");
    if(await kirim("dokumen_simpan",{id:S.dokEdit||"",nama:v("dk_nama"),link,ket:v("dk_ket")},ids)){S.dokEdit=null;render()}return}
  if(f.id==="fPejabat")return kirim("pejabat",{dekan:v("pj_dekan"),dekanNidn:v("pj_dekan_nidn"),kp:v("pj_kp"),kpNidn:v("pj_kp_nidn")},ids);
  if(f.id==="fSurvey"){const d=S.svDraft||{},r={};
    for(const k of ["dosen","prodi"]){r[k]=SV[k].butir.map((_,i)=>+d[`sv_${k}_${i}`]||0);
      const kosong=r[k].findIndex(n=>!n);if(kosong>-1)return toast(`${SV[k].judul}: pernyataan nomor ${kosong+1} belum dipilih`);
      for(const [e] of SV[k].esai){const t=v(`sv_${k}_${e}`);if(!t)return toast(`${SV[k].judul}: masih ada pertanyaan isian yang kosong`);r[k+(e==="baik"?"Baik":"Harap")]=t}}
    if(await kirim("survey_kirim",r,ids)){S.svDraft={};render()}return}
  if(f.id==="fPeriode"){const b=v("pd_buka"),t=v("pd_tutup");
    if(t<b)return toast("Tanggal ditutup harus sama atau setelah tanggal dibuka");
    return kirim("periode_tambah",{ta:v("pd_ta"),sem:v("pd_sem"),buka:b,tutup:t},ids)}
  if(f.id==="fJudul"){if(await kirim("judul_ubah",{judul:v("jd_baru").replace(/\s+/g," ")},ids)){S.editJudul=false;render()}return}
  if(f.id==="fPassword"){const g=id=>document.getElementById(id).value,lama=g("pw_lama"),baru=g("pw_baru");
    if(baru.length<6)return toast("Password baru minimal 6 karakter");
    if(baru===lama)return toast("Password baru harus berbeda dari password lama");
    if(baru!==g("pw_ulang"))return toast("Pengulangan password baru tidak sama");
    return kirim("sandi",{lama,baru},ids)}
  if(f.id==="fProfil"){const g=id=>{const el=document.getElementById(id);return el?el.value.trim():undefined},o={};
    const map={nama:"pf_nama",jk:"pf_jk",tlahir:"pf_tlahir",tgllahir:"pf_tgllahir",angkatan:"pf_angkatan",jabatan:"pf_jabatan",keahlian:"pf_keahlian",email:"pf_email",hp:"pf_hp",alamat:"pf_alamat"};
    for(const[k,id]of Object.entries(map)){const x=g(id);if(x!==undefined)o[k]=x}
    return kirim("profil",o,ids)}
  if(f.id==="fSkripsi")return kirim("skripsi_daftar",{judul:v("sj"),bidang:v("sb"),ipk:v("si"),sks:v("ss")},ids);
  if(f.dataset.tim){const id=f.dataset.tim,dosen=[0,1,2].map(i=>v(`d${id}_${i}`));
    if(dosen.some(x=>!x))return toast("Pilih ketiga dosen terlebih dahulu");
    if(new Set(dosen).size<3)return toast("Satu dosen tidak boleh memegang dua peran untuk mahasiswa yang sama");
    return kirim("tim_tetapkan",{id,dosen},ids)}
});
const tandaWaktu=()=>isoToday()+"|"+S.periode.map(statusOf).join();let tandaLama=tandaWaktu();
setInterval(()=>{const t=tandaWaktu();if(t!==tandaLama){tandaLama=t;if(S.user&&!mengetik())renderKeep()}segarkan()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)segarkan()});
mulai();
</script>
